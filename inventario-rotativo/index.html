<!-- xlsx-js-style é o SheetJS 0.18.5 com escrita de estilo (borda, fundo, negrito).
     A build community do xlsx descarta a propriedade .s das células, então a planilha
     da auditoria saía sem grade nenhuma. Mesma API e mesma leitura; o worker segue com
     o xlsx original, que só precisa LER. -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="js/db.js"></script>
<script src="js/rules.js"></script>

<script>
  document.getElementById('brandLogo').addEventListener('click', function(){
    var el = this;
    el.classList.remove('spin');
    void el.offsetWidth;
    el.classList.add('spin');
  });
  irInit();
  /* Atualização do app.
     No carregamento, uma versão nova recarrega sozinha — ninguém perde nada,
     a página acabou de abrir.
     Com a aba já aberta é diferente: recarregar no meio de uma importação
     jogaria o trabalho fora. Aí só avisa, e quem decide a hora é o usuário.
     A checagem periódica existe porque uma aba deixada aberta por semanas nunca
     chamava reg.update() de novo e ficava presa na versão antiga
     indefinidamente — era o caso que dava "o dash não atualizou". */
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      const tinhaControle = !!navigator.serviceWorker.controller;
      const carregadoEm = Date.now();
      navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(reg=>{
        const avisar = ()=>{
          const el = document.getElementById('irUpdateBar');
          if(el) el.hidden = false;
        };
        reg.addEventListener('updatefound', ()=>{
          const novo = reg.installing;
          if(!novo) return;
          novo.addEventListener('statechange', ()=>{
            if(novo.state !== 'activated' || !tinhaControle) return;
            // Até 10s depois de abrir ainda é "carregamento": recarrega direto.
            if(Date.now() - carregadoEm < 10000) window.location.reload();
            else avisar();
          });
        });
        const checar = ()=>{ reg.update().catch(()=>{}); };
        checar();
        setInterval(checar, 30*60*1000);
        document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checar(); });
      }).catch(err=>console.warn('SW falhou ao registrar', err));
    });
  }
</script>
