  <main class="content">
    <div class="topbar">
      <button class="mobile-menu-btn" onclick="irToggleSidebar()" title="Abrir menu" aria-label="Abrir menu">

      </button>
      <img src="brand/Logo_LDM_hor_2.png" alt="Loja do Mecânico" class="topbar-logo">
      <div class="topbar-titles">
        <h1 id="tabTitle">Dashboard Executivo</h1>
        <p id="tabSubtitle">Visão geral do ciclo ativo.</p>
      </div>
      <input class="global-search" id="globalSearch" type="text" placeholder="Pesquisa global (item, local, colaborador)...">
      <div class="topbar-filters">
        <div class="tb-filter">
          <label>Ciclo</label>
          <div id="cycleBadge">Nenhum ciclo ativo</div>
        </div>
        <div class="tb-filter">
          <label>Mês</label>
          <select id="monthFilterSelect" onchange="irSetMonthFilter(this.value)"><option value="">Todos</option></select>
        </div>
      </div>
    </div>
    <div class="page-scroll">
      <div id="viewRoot"><p class="field-hint">Carregando...</p></div>
    </div>
  </main>
  <div class="sidebar-backdrop" onclick="irCloseSidebarMobile()"></div>

<div class="zoom-ctrl zoom-ctrl-float" title="Zoom da tela">
  <button onclick="irZoomOut()" aria-label="Diminuir zoom">−</button>
  <span id="zoomLabel">100%</span>
  <button onclick="irZoomIn()" aria-label="Aumentar zoom">+</button>
</div>

<div id="toast" class="toast hidden"></div>
<div id="irPrintArea"></div>
<div id="irChartTooltip" class="chart-tooltip hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="js/db.js"></script>
<script src="js/rules.js"></script>
<script src="js/app.js"></script>
<script>
  irInit();
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(reg=>{
        reg.update();
        reg.addEventListener('updatefound', ()=>{
          const novo = reg.installing;
          if(!novo) return;
          novo.addEventListener('statechange', ()=>{
            if(novo.state==='activated' && hadController) window.location.reload();
          });
        });
      }).catch(err=>console.warn('SW falhou ao registrar', err));
    });
  }
</script>
</body>
