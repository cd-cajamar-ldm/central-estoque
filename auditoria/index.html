<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Controle de Estoque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#0A0B23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="audit/audit.css">
<style>
  :root{
    --paper:#0A0B23;--surface:#0B1934;--surface2:#0e1530;
    --ink:#EEEDF5;--ink-soft:#7B80A0;--line:#1E2340;
    --accent:#FA4616;--accent-light:rgba(250,70,22,.12);
    --blue:#001A72;--blue2:#1A3180;--blue3:#33488E;
    --success:#1A3180;--danger:#C83812;
    --radius:7px;--radius-lg:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;font-size:13.5px;}
  h1,h2,h3,h4{font-family:'Poppins',sans-serif;font-weight:700;letter-spacing:.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  a{color:var(--accent);}

  /* SHELL */
  .shell{display:flex;height:100vh;overflow:hidden;}

  /* SIDEBAR — mesmo azul-marinho da sidebar da Oficina LDM (Painel raiz) */
  .sidebar{
    width:220px;flex-shrink:0;
    background:#0B1230;
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .brand{
    padding:16px 14px 14px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;display:flex;align-items:center;gap:10px;
  }
  .brand-logo{
    position:relative;width:52px;height:52px;border-radius:15px;overflow:hidden;
    background:linear-gradient(145deg,#FF8A4C,#FE5000 55%,#C83812);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 6px 14px -4px rgba(254,80,0,.55),inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .2s;
  }
  .brand-logo:hover{transform:translateY(-1px) scale(1.05);}
  .brand-logo::before{
    content:'';position:absolute;top:-50%;left:-70%;width:55%;height:220%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
    transform:rotate(18deg);animation:brandShine 5s ease-in-out infinite;
  }
  @keyframes brandShine{0%{left:-70%;}38%{left:150%;}100%{left:150%;}}
  .brand-logo img{position:relative;z-index:1;width:78%;height:78%;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));}
  .brand-logo:hover img{animation:brandWiggle 1s ease-in-out infinite;}
  @keyframes brandWiggle{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-9deg);}75%{transform:rotate(9deg);}}
  .brand-text{flex:1;min-width:0;}
  .brand-name{font-family:'Poppins',sans-serif;font-size:13px;font-weight:800;color:var(--ink);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand-sub{font-size:10px;color:var(--ink-soft);margin-top:1px;}
  .brand-back{
    display:flex;align-items:center;gap:6px;padding:9px 14px;border-bottom:1px solid var(--line);
    font-size:11.5px;font-weight:600;color:var(--ink-soft);text-decoration:none;flex-shrink:0;
  }
  .brand-back:hover{color:var(--ink);background:rgba(0,0,0,.03);}

  .sidebar-body{flex:1;overflow-y:auto;padding:6px 0;}

  /* Option D — Linear style sections with colored accents */
  .nsg{margin:0 0 6px 0;}
  .nsl{
    display:flex;align-items:center;gap:8px;
    font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    padding:10px 12px 5px 14px;
  }
  .nsl::before{
    content:'';display:block;width:3px;height:12px;border-radius:2px;flex-shrink:0;
  }
  .nsg-orange .nsl{color:#C84010;}
  .nsg-orange .nsl::before{background:#FA4616;}
  .nsg-blue .nsl{color:#4060A0;}
  .nsg-blue .nsl::before{background:#001A72;}
  .nsg-blue2 .nsl{color:#4868A8;}
  .nsg-blue2 .nsl::before{background:#1A3180;}
  .nsg-blue3 .nsl{color:#5070B0;}
  .nsg-blue3 .nsl::before{background:#33488E;}
  .nsg-audit .nsl{color:#E0704C;}
  .nsg-audit .nsl::before{background:#FB6B45;}

  .nsg-orange .nav-item.active{background:rgba(250,70,22,.1);color:#FA4616;border-left-color:#FA4616;}
  .nsg-blue .nav-item.active{background:rgba(0,26,114,.15);color:#6080D0;border-left-color:#001A72;}
  .nsg-blue2 .nav-item.active{background:rgba(26,49,128,.15);color:#7090D8;border-left-color:#1A3180;}
  .nsg-blue3 .nav-item.active{background:rgba(51,72,142,.15);color:#8098D8;border-left-color:#33488E;}
  .nsg-audit .nav-item.active{background:rgba(251,107,69,.12);color:#FB6B45;border-left-color:#FB6B45;}

  .nav-item{
    display:flex;align-items:center;gap:9px;
    width:100%;text-align:left;background:none;border:none;
    color:#6070A0;padding:5px 12px 5px 22px;
    font-size:12.5px;border-left:2px solid transparent;
    transition:background .1s,color .1s;border-radius:0;
  }
  .nav-item span{flex:1;text-align:left;}
  .nav-item svg{flex-shrink:0;opacity:.5;transition:opacity .1s;}
  .nav-item:hover{background:rgba(255,255,255,.04);color:var(--ink);}
  .nav-item:hover svg{opacity:.9;}
  .nav-item.active{font-weight:600;border-left:2px solid;}
  .nav-item.active svg{opacity:1;}
  .nav-item.nav-main{
    padding:6px 12px 6px 14px;font-size:13px;
    font-weight:500;color:var(--ink);
  }
  .nav-item.nav-main svg{opacity:.75;}

  /* Quick access buttons at bottom of sidebar */
  .sidebar-quick{
    padding:8px 10px 12px;
    border-top:1px solid var(--line);
    flex-shrink:0;
  }
  .sq-label{
    font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:#3A4060;padding:4px 4px 6px;
  }
  .sq-btn{
    display:flex;align-items:center;gap:8px;width:100%;
    background:rgba(250,70,22,.08);border:1px solid rgba(250,70,22,.2);border-radius:6px;
    padding:7px 10px;color:var(--accent);font-size:12px;font-weight:500;cursor:pointer;
    margin-bottom:5px;transition:all .12s;
  }
  .sq-btn:last-child{margin-bottom:0;background:rgba(26,49,128,.1);border-color:rgba(26,49,128,.3);color:#6080C0;}
  .sq-btn:hover{filter:brightness(1.15);}
  .sq-btn svg{opacity:.8;flex-shrink:0;}

  .nav-rename-input{flex:1;background:rgba(255,255,255,.08);border:1px dashed var(--accent);border-radius:4px;color:var(--ink);font-size:12.5px;padding:3px 8px;font-family:'Inter',sans-serif;}

  /* MAIN */
  .content{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);}
  .topbar{
    padding:14px 24px 12px;
    border-bottom:1px solid var(--line);
    background:var(--surface2);flex-shrink:0;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .topbar-left h1{font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);}
  .topbar-left p{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
  .cd-badge{flex-shrink:0;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink-soft);font-size:11px;font-weight:700;letter-spacing:.04em;padding:7px 14px;border-radius:100px;white-space:nowrap;}
  .storage-warning{background:rgba(200,56,18,.15);color:#f08060;border:1px solid rgba(200,56,18,.35);border-radius:var(--radius);padding:7px 16px;font-size:12.5px;margin:0 24px;flex-shrink:0;}
  .page-scroll{flex:1;overflow-y:auto;padding:20px 24px;}

  /* STAT CARDS */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
  .stat-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:14px 16px;position:relative;overflow:hidden;
  }
  .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--line);}
  .stat-card.accent::before{background:var(--accent);}
  .stat-card.blue::before{background:var(--blue2);}
  .stat-card.blue3::before{background:var(--blue3);}
  .stat-card .num{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;line-height:1;color:var(--ink);}
  .stat-card .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-top:5px;}
  .stat-card.alert .num{color:var(--accent);}

  /* PANELS */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:16px;}
  .panel h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
  .panel-row{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;}

  /* CHARTS */
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;}
  .bar-label{width:100px;flex-shrink:0;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;background:var(--line);border-radius:100px;height:5px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:100px;}
  .bar-value{width:24px;text-align:right;color:var(--ink);flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:11px;}
  .hist-row{display:flex;justify-content:space-between;align-items:flex-end;gap:4px;height:90px;padding-top:6px;}
  .hist-col{display:flex;flex-direction:column;align-items:center;flex:1;}
  .hist-bar-wrap{height:55px;display:flex;align-items:flex-end;}
  .hist-bar{width:14px;border-radius:3px 3px 0 0;}
  .hist-value{font-size:10px;color:var(--ink-soft);margin-top:3px;font-family:'IBM Plex Mono',monospace;}
  .hist-label{font-size:9.5px;color:var(--ink-soft);margin-top:2px;}

  /* ACTION BAR */
  .action-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .action-bar .btn-group{display:flex;gap:6px;flex-wrap:wrap;}
  .action-bar .filters{display:flex;gap:6px;flex-wrap:wrap;}
  .action-bar input[type=text],.action-bar select{
    border:1px solid var(--line);border-radius:var(--radius);
    padding:6px 10px;font-size:13px;background:var(--surface);color:var(--ink);
  }

  /* BUTTONS */
  .btn{border-radius:var(--radius);padding:7px 14px;font-size:13px;border:1px solid transparent;transition:filter .12s;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{filter:brightness(.88);}
  .btn-primary{background:var(--accent);color:#0A0B23;font-weight:700;}
  .btn-secondary{background:var(--surface);border:1px solid var(--line);color:var(--ink);}
  .btn-danger-text{background:none;border:none;color:#c06050;font-size:12px;padding:3px 5px;}
  .btn-link{background:none;border:none;color:var(--accent);font-size:12px;padding:3px 5px;}

  /* TABLES */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;background:#001A72;color:#fff;font-family:'Poppins',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;}
  thead th:first-child{border-radius:4px 0 0 0;}
  thead th:last-child{border-radius:0 4px 0 0;}
  tbody td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:rgba(250,70,22,.04);}
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);}
  .table-wrap table{min-width:560px;}

  /* TAGS */
  .stamp-tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:4px;}
  .tag-ok{color:#fff;background:var(--blue2);}
  .tag-alert{color:#0A0B23;background:var(--accent);}
  .tag-neutral{color:#fff;background:var(--blue3);}
  .tag-muted{color:var(--ink-soft);background:var(--line);}

  /* EMPTY STATE */
  .empty-state{text-align:center;padding:48px 20px;color:var(--ink-soft);}
  .empty-state .eicon{font-size:32px;margin-bottom:14px;color:var(--line);}
  .empty-state h3{color:var(--ink);font-size:15px;text-transform:none;margin-bottom:6px;font-family:'Inter',sans-serif;font-weight:500;}
  .empty-state p{font-size:13px;margin-bottom:18px;}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(4,5,20,.88);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal-card{background:var(--surface);border-radius:var(--radius-lg);border-top:3px solid var(--accent);padding:20px 22px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;}
  .modal-card h2{font-size:16px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:14px;}
  form label{display:block;font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 3px;}
  form input,form select,form textarea{width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;font-size:13.5px;font-family:'Inter',sans-serif;color:var(--ink);background:var(--paper);}
  form textarea{resize:vertical;min-height:56px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .checkbox-row input{width:auto;}
  .checkbox-row label{margin:0;text-transform:none;font-size:13px;color:var(--ink);}
  .form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .field-hint{font-size:10.5px;color:var(--ink-soft);margin-top:2px;text-transform:none;letter-spacing:0;}
  .field-section-title{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 2px;border-top:1px dashed var(--line);padding-top:12px;}

  /* TOAST */
  .toast{position:fixed;bottom:18px;right:18px;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:var(--radius);font-size:13px;z-index:60;border-left:3px solid var(--accent);}
  .toast.error{border-left-color:var(--danger);color:#f09080;}
  .toast.hidden{display:none;}

  /* LAYOUT UTILS */
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  /* KANBAN */
  .kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;}
  .kanban-col{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);min-width:230px;flex:1;display:flex;flex-direction:column;}
  .kanban-col.drag-over{border-color:var(--accent);}
  .kanban-col-header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600;}
  .kanban-cards{padding:8px;flex:1;display:flex;flex-direction:column;gap:7px;overflow-y:auto;max-height:56vh;}
  .kanban-empty{font-size:12px;color:var(--ink-soft);text-align:center;padding:14px 0;}
  .kanban-card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:9px 11px;cursor:grab;}
  .kanban-card:active{cursor:grabbing;}
  .kanban-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
  .kanban-card-title{font-size:13px;font-weight:500;margin-bottom:3px;color:var(--ink);}
  .kanban-card-desc{font-size:11px;color:var(--ink-soft);margin-bottom:6px;}
  .kanban-card-footer{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-soft);}
  .kanban-overdue{color:var(--accent);font-weight:600;}

  @media(max-width:760px){
    .shell{flex-direction:column;height:auto;overflow:auto;}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);}
    .sidebar-body{display:flex;flex-direction:row;overflow-x:auto;padding:0;}
    .nav-section{display:none;}
    .content{overflow:visible;}
    .page-scroll{padding:14px;}
    .two-col,.dash-grid{grid-template-columns:1fr;}
    html,body{overflow:auto;}
  }
</style>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><img src="brand/Logo_LDM_icon.png" alt="Loja do Mecânico"></div>
      <div class="brand-text">
        <div class="brand-name">OFICINA LDM</div>
        <div class="brand-sub">lugar de quem faz</div>
      </div>
    </div>
    <a class="brand-back" href="../">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span>Voltar para a Central</span>
    </a>
    <nav class="sidebar-body" id="nav">

      <div class="nsg nsg-orange">
        <div class="nsl">Principal</div>
        <button class="nav-item nav-main" data-tab="painel"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Painel</span></button>
      </div>

      <div class="nsg nsg-blue">
        <div class="nsl">Equipe</div>
        <button class="nav-item" data-tab="pessoas"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><circle cx="19" cy="7" r="2"/><path d="M23 21v-1a3 3 0 0 0-2-2.8"/></svg><span>Colaboradores</span></button>
        <button class="nav-item" data-tab="treinamentos"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>Treinamentos</span></button>
      </div>

      <div class="nsg nsg-blue2">
        <div class="nsl">Estoque</div>
        <button class="nav-item" data-tab="gestao"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg><span>Gestão de Estoque</span></button>
        <button class="nav-item" data-tab="qry"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg><span>Consultas (QRY)</span></button>
        <button class="nav-item" data-tab="dashboards"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>Dashboards</span></button>
      </div>

      <div class="nsg nsg-blue3">

/* --- API Supabase (REST direto, sem SDK) --- */
function sbHeaders(){
  return {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=minimal'
  };
}
async function sbGetAll(){
  const url = SUPABASE_URL + '/rest/v1/' + TABLE + '?select=chave,valor';
  const res = await fetch(url, {headers: sbHeaders()});
  if(!res.ok) throw new Error('Supabase GET HTTP ' + res.status);
  const rows = await res.json();
  const obj = {};
  rows.forEach(r => { obj[r.chave] = r.valor; });
  return obj;
}
async function sbUpsert(chave, valor){
  const url = SUPABASE_URL + '/rest/v1/' + TABLE;
  const res = await fetch(url, {
    method: 'POST',
    headers: Object.assign({}, sbHeaders(), {'Prefer': 'resolution=merge-duplicates'}),
    body: JSON.stringify({chave, valor})
  });
  if(!res.ok){
    const t = await res.text();
    console.error('sbUpsert error', res.status, t);
    throw new Error('Erro ao salvar (' + res.status + '). Verifique sua conexão.');
  }
}
async function sbDeleteAll(){
  const url = SUPABASE_URL + '/rest/v1/' + TABLE + '?chave=neq.___';
  const res = await fetch(url, {method:'DELETE', headers: sbHeaders()});
  if(!res.ok) throw new Error('Supabase DELETE HTTP ' + res.status);
}

async function loadAll(){
  if(!BACKEND_OK){
    document.getElementById('storage-banner').innerHTML =
      '<div class="storage-warning"><b>Banco de dados não configurado.</b> Cole a URL e a chave do Supabase no topo do arquivo HTML para começar a salvar dados.</div>';
    return;
  }
  try{
    document.getElementById('storage-banner').innerHTML =
      '<div class="storage-warning" style="background:rgba(26,49,128,.25);border-color:#33488E;color:#AEB2C6;">Carregando dados...</div>';
    const all = await sbGetAll();
    for(const k of KEYS){
      const raw = all[k];
      if(k==='tabNomes'||k==='config'){
        STATE[k] = raw ? JSON.parse(raw) : {};
      } else {
        STATE[k] = raw ? JSON.parse(raw) : [];
      }
    }
    document.getElementById('storage-banner').innerHTML = '';
  }catch(e){
    document.getElementById('storage-banner').innerHTML =
      '<div class="storage-warning"><b>Erro ao conectar com o banco de dados.</b> Verifique se a URL e a chave do Supabase estão corretas e se a tabela foi criada. Erro: ' + e.message + '</div>';
  }
  STATE.restricoes = STATE.restricoes.map(r=>{
    if(r.finalizada===undefined){ r.finalizada = (r.ativa===false); }
    return r;
  });
  STATE.classes = STATE.classes.map(c=>{
    if(c.finalidade===undefined){ c.finalidade = c.descricao || ''; }
    return c;
  });
  STATE.pessoas = STATE.pessoas.map(p=>{
    if(p.extras===undefined) p.extras = {};
    if(p.fretado===undefined) p.fretado = 'Não';
    return p;
  });
  // init default tipos if empty
  if(!STATE.tiposAtividade) STATE.tiposAtividade = [];
}
async function persist(key){
  if(!BACKEND_OK) return;
  try{
    const val = (key==='tabNomes'||key==='config') ? STATE[key] : STATE[key];
    await sbUpsert(key, JSON.stringify(val));
  }catch(e){ showToast('Erro ao salvar: ' + e.message, true); }
}

function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ t.className='toast hidden'; }, 2400);
}

function applyTabNames(){
  document.querySelectorAll('.nav-item[data-tab]').forEach(b=>{
    const tab = b.dataset.tab;
    const label = STATE.tabNomes[tab] || (TAB_LABELS[tab] ? TAB_LABELS[tab][0] : tab);
    const span = b.querySelector('span');
    if(span) span.textContent = label;
  });
}
function startRenameTab(btn){
  const tab = btn.dataset.tab;
  const span = btn.querySelector('span');
  if(!span) return;
  const current = STATE.tabNomes[tab] || (TAB_LABELS[tab] ? TAB_LABELS[tab][0] : tab);
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'nav-rename-input';
  input.value = current;
  span.replaceWith(input);
  input.focus(); input.select();
  let done = false;
  const finish = async (save)=>{
    if(done) return; done = true;
    if(save){
      const val = input.value.trim();
      const defaultLabel = TAB_LABELS[tab] ? TAB_LABELS[tab][0] : tab;
      if(val && val!==defaultLabel){ STATE.tabNomes[tab] = val; } else { delete STATE.tabNomes[tab]; }
      await persist('tabNomes');
    }
    const newSpan = document.createElement('span');
    newSpan.textContent = STATE.tabNomes[tab] || (TAB_LABELS[tab] ? TAB_LABELS[tab][0] : tab);
    input.replaceWith(newSpan);
    if(CURRENT_TAB===tab){ document.getElementById('tab-title').textContent = newSpan.textContent; }
  };
  input.addEventListener('blur', ()=>finish(true));
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){ e.preventDefault(); input.blur(); }
    if(e.key==='Escape'){ e.preventDefault(); finish(false); }
  });
}

/* ---------- COMPONENTES DE GRÁFICO (sem dependências externas) ---------- */
function barList(title, dataPairs, color){
  const max = Math.max(1, ...dataPairs.map(d=>d.value));
  return `<div class="panel">
    <h3>${esc(title)}</h3>
    ${dataPairs.length ? dataPairs.map(d=>`
      <div class="bar-row">
        <span class="bar-label">${esc(d.label)}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(d.value/max*100)}%;background:${color};"></div></div>
        <span class="bar-value mono">${d.value}</span>
      </div>`).join('') : `<p style="color:var(--ink-soft);font-size:13.5px;">Sem dados suficientes ainda.</p>`}
  </div>`;
}
function miniHistogram(title, dataPairs, color){
  const max = Math.max(1, ...dataPairs.map(d=>d.value));
  return `<div class="panel">
    <h3>${esc(title)}</h3>
    <div class="hist-row">
      ${dataPairs.map(d=>`
        <div class="hist-col">
          <div class="hist-bar-wrap"><div class="hist-bar" style="height:${Math.max(4,Math.round(d.value/max*70))}px;background:${color};"></div></div>
          <span class="hist-value mono">${d.value}</span>
          <span class="hist-label">${esc(d.label)}</span>
        </div>`).join('')}
    </div>
  </div>`;
}

/* ---------- PAINEL ---------- */
function renderPainel(){
  const ativos = STATE.pessoas.filter(p=>p.status==='Ativo').length;
  const hoje = STATE.atividades.filter(a=>a.data===todayStr()).length;
  const restricoesAndamento = STATE.restricoes.filter(r=>!r.finalizada).length;
  const tarefasPendentes = STATE.tarefas.filter(t=>t.status!=='Concluído').length;
  const tarefasAtrasadas = STATE.tarefas.filter(t=>t.prazo && t.prazo<todayStr() && t.status!=='Concluído').length;
  const tudoVazio = CORE_KEYS.every(k=>STATE[k].length===0);

  let html = `<div class="stat-grid">
    <div class="stat-card"><div class="num">${ativos}</div><div class="label">Pessoas ativas</div></div>
    <div class="stat-card"><div class="num">${hoje}</div><div class="label">Atividades hoje</div></div>
    <div class="stat-card"><div class="num">${STATE.locais.length}</div><div class="label">Locais cadastrados</div></div>
    <div class="stat-card"><div class="num">${restricoesAndamento}</div><div class="label">Restrições em andamento</div></div>
    <div class="stat-card"><div class="num">${tarefasPendentes}</div><div class="label">Tarefas pendentes</div></div>
    <div class="stat-card ${tarefasAtrasadas?'alert':''}"><div class="num">${tarefasAtrasadas}</div><div class="label">Tarefas atrasadas</div></div>
  </div>`;

  if(tudoVazio){
    html += `<div class="empty-state panel">
      <div class="brand-logo" style="margin:0 auto 10px;width:48px;height:48px;border-radius:14px;"><img src="brand/Logo_LDM_icon.png" alt="Loja do Mecânico"></div>
      <h3>Ainda não há dados cadastrados</h3>
      <p>Comece cadastrando o quadro de pessoas, depois locais, classes e tarefas.</p>
      <button class="btn btn-primary" onclick="loadSampleData()">Carregar dados de exemplo</button>
    </div>`;
    return html;
  }

  const turnoData = ['Manhã','Tarde','Noite','Integral']
    .map(t=>({label:t, value:STATE.pessoas.filter(p=>p.turno===t).length}))
    .filter(d=>d.value>0);

  const statusTarefaData = ['A Fazer','Em Andamento','Concluído']
    .map(s=>({label:s, value:STATE.tarefas.filter(t=>t.status===s).length}))
    .filter(d=>d.value>0);

  const colabMap = {};
  STATE.atividades.forEach(a=>{ if(!a.pessoaId) return; colabMap[a.pessoaId]=(colabMap[a.pessoaId]||0)+1; });
  const colaboradorData = Object.entries(colabMap)
    .map(([pid,v])=>({label:nameOf(STATE.pessoas,pid), value:v}))
    .sort((a,b)=>b.value-a.value).slice(0,6);

  const diasData = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.toISOString().slice(0,10);
    diasData.push({label:d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}), value: STATE.atividades.filter(a=>a.data===ds).length});
  }

  html += `<div class="dash-grid">
    ${barList('Pessoas por turno', turnoData, '#1A3180')}
    ${barList('Tarefas por status', statusTarefaData, 'var(--accent)')}
    ${barList('Atividades por colaborador', colaboradorData, '#33488E')}
    ${miniHistogram('Atividades nos últimos 7 dias', diasData, 'var(--accent-bright)')}
  </div>`;

  const recentAtividades = [...STATE.atividades].sort((a,b)=> (b.data+b.criadoEm).localeCompare(a.data+a.criadoEm)).slice(0,5);
  const tarefasDestaque = STATE.tarefas.filter(t=>t.status!=='Concluído')
    .sort((a,b)=>(a.prazo||'9999-99-99').localeCompare(b.prazo||'9999-99-99')).slice(0,5);

  html += `<div class="two-col">
    <div class="panel">
      <h3>Atividades recentes</h3>
      ${recentAtividades.length ? recentAtividades.map(a=>`
        <div class="panel-row" style="margin-bottom:8px;border-bottom:1px dashed var(--line);padding-bottom:8px;">
          <span class="mono" style="font-size:12.5px;">${fmtDate(a.data)}</span>
          <span class="stamp-tag tag-neutral">${esc(a.tipo)}</span>
          <span style="font-size:12.5px;color:var(--ink-soft);">${nameOf(STATE.pessoas,a.pessoaId)}</span>
        </div>`).join('') : `<p style="color:var(--ink-soft);font-size:13.5px;">Nenhuma atividade registrada ainda.</p>`}
    </div>
    <div class="panel">
      <h3>Próximas tarefas</h3>
      ${tarefasDestaque.length ? tarefasDestaque.map(t=>{
        const overdue = t.prazo && t.prazo<todayStr();
        return `<div class="panel-row" style="margin-bottom:8px;border-bottom:1px dashed var(--line);padding-bottom:8px;">
          <span style="font-size:12.5px;">${esc(t.titulo)}</span>
          <span class="mono ${overdue?'kanban-overdue':''}" style="font-size:12.5px;">${t.prazo?fmtDate(t.prazo):'sem prazo'}</span>
        </div>`;
      }).join('') : `<p style="color:var(--ink-soft);font-size:13.5px;">Nenhuma tarefa pendente.</p>`}
    </div>
  </div>`;
  return html;
}

async function submitPessoa(e,id){
  e.preventDefault();
  const nome = document.getElementById('inp-nome').value.trim();
  if(!nome){ showToast('Informe o nome.', true); return false; }
  const extras = {};
  STATE.pessoasColunas.forEach(c=>{
    const el = document.getElementById('extra-'+c.id);
    extras[c.id] = el ? el.value.trim() : '';
  });
  const data = {
    nome, turno: document.getElementById('inp-turno').value,
    cargo: document.getElementById('inp-cargo').value.trim(),
    fretado: document.getElementById('inp-fretado').value,
    contato: document.getElementById('inp-contato').value.trim(),
    localId: document.getElementById('inp-local').value,
    status: document.getElementById('inp-status').value,
    extras
  };
  if(id){ Object.assign(findById(STATE.pessoas,id), data); }
  else { STATE.pessoas.push({id:uid(), ...data}); }
  await persist('pessoas'); closeModal(); renderView();
  showToast(id?'Pessoa atualizada.':'Pessoa adicionada.');

async function deletePessoa(id){

  showToast('Pessoa removida.');

function renderCalendarioView(){
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthName = new Date(year, month, 1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const tarefasByDate = {};
  STATE.tarefas.forEach(t=>{ if(t.prazo){ if(!tarefasByDate[t.prazo]) tarefasByDate[t.prazo]=[]; tarefasByDate[t.prazo].push(t); } });
  const dow = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  let cells = '';
  for(let i=0;i<(firstDay===0?6:firstDay-1);i++) cells += '<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const ts = tarefasByDate[ds]||[];
    const isToday = ds===todayStr();
    cells += `<div style="background:var(--surface);border:1px solid ${isToday?'var(--accent)':'var(--line)'};border-radius:4px;padding:6px;min-height:72px;">
      <div style="font-size:11px;font-weight:${isToday?'700':'400'};color:${isToday?'var(--accent)':'var(--ink-soft)'};margin-bottom:4px;">${d}</div>
      ${ts.slice(0,3).map(t=>`<div style="font-size:10px;padding:2px 5px;border-radius:3px;margin-bottom:2px;background:${t.status==='Concluído'?'var(--blue2)':'var(--accent-muted)'};color:${t.status==='Concluído'?'#fff':'var(--accent)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(t.titulo)}</div>`).join('')}
      ${ts.length>3?`<div style="font-size:10px;color:var(--ink-soft);">+${ts.length-3} mais</div>`:''}
    </div>`;
  }
  return `<div style="margin-bottom:12px;font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);">${monthName}</div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;">
    ${dow.map(d=>`<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);text-align:center;padding:4px 0;">${d}</div>`).join('')}
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">${cells}</div>`;
}

function renderGanttView(){
  const sorted = [...STATE.tarefas].filter(t=>t.prazo).sort((a,b)=>a.prazo.localeCompare(b.prazo));
  if(!sorted.length) return '<div class="panel"><p style="color:var(--ink-soft);font-size:13.5px;">Nenhuma tarefa com prazo definido para exibir no Gantt.</p></div>';
  const minDate = new Date(sorted[0].prazo+'T00:00:00');
  const maxDate = new Date(sorted[sorted.length-1].prazo+'T00:00:00');
  maxDate.setDate(maxDate.getDate()+3);
  const totalDays = Math.max(1, Math.ceil((maxDate-minDate)/(1000*60*60*24)));
  const barColors = {'A Fazer':'#33488E','Em Andamento':'var(--accent)','Concluído':'var(--blue2)'};
  return `<div class="table-wrap" style="overflow-x:auto;">
    <div style="min-width:700px;">
      ${sorted.map(t=>{
        const start = new Date((t.prazo||todayStr())+'T00:00:00');
        const offset = Math.max(0,Math.ceil((start-minDate)/(1000*60*60*24)));
        const pct = Math.min(96, Math.round(offset/totalDays*100));
        const width = Math.max(2, Math.round(1/totalDays*100));
        return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
          <div style="width:180px;flex-shrink:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(t.titulo)}</div>
          <div style="flex:1;background:var(--paper);border-radius:4px;height:20px;position:relative;border:1px solid var(--line);">
            <div style="position:absolute;left:${pct}%;width:${width}%;min-width:6px;height:100%;background:${barColors[t.status]||'var(--blue2)'};border-radius:3px;"></div>
          </div>
          <div style="width:80px;flex-shrink:0;font-size:11px;color:var(--ink-soft);text-align:right;font-family:'IBM Plex Mono',monospace;">${fmtDate(t.prazo)}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function onDragTarefa(e,id){ e.dataTransfer.setData('text/plain', id); }
async function onDropTarefa(e, status){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const id = e.dataTransfer.getData('text/plain');
  const t = findById(STATE.tarefas, id);
  if(t && t.status!==status){

    await persist('tarefas');

function openTarefaForm(id){
  const t = id?findById(STATE.tarefas,id):null;
  openModal(`<h2>${id?'Editar tarefa':'Nova tarefa'}</h2>
    <form onsubmit="return submitTarefa(event,'${id||''}')">

      <label>Responsável</label>
      <select id="inp-resp"><option value="">—</option>${STATE.pessoas.map(p=>`<option value="${p.id}" ${t&&t.responsavelId===p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}</select>
      <label>Status</label>

      <div class="form-actions">

        <button type="submit" class="btn btn-primary">${id?'Salvar':'Criar tarefa'}</button>

async function submitTarefa(e,id){
  e.preventDefault();
  const titulo=document.getElementById('inp-titulo').value.trim();
  if(!titulo){showToast('Informe o título da tarefa.',true);return false;}
  const data={
    titulo, descricao:document.getElementById('inp-desc').value.trim(),
    responsavelId:document.getElementById('inp-resp').value,
    status:document.getElementById('inp-status').value,
    prioridade:document.getElementById('inp-prio').value,
    prazo:document.getElementById('inp-prazo').value
  };
  if(id) Object.assign(findById(STATE.tarefas,id),data); else STATE.tarefas.push({id:uid(), criadoEm:String(Date.now()), ...data});
  await persist('tarefas'); closeModal(); renderView();
  showToast(id?'Tarefa atualizada.':'Tarefa criada.');
  return false;
}
async function deleteTarefa(id){
  if(!confirm('Excluir esta tarefa?')) return;
  STATE.tarefas = STATE.tarefas.filter(x=>x.id!==id);
  await persist('tarefas'); renderView();
  showToast('Tarefa excluída.');
}

/* ---------- ATIVIDADES — quadro de responsabilidades ---------- */
const TIPOS_DEFAULT = ['Inventário','Auditoria de Movimentação','Auditoria de Ocupação','Auditoria de Crítico','Inventário de Curva'];
const PERIODOS = ['Dia','Semana','Mês','Ciclo'];
const MESES_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const CICLO_RANGES = [
  {ini:'01-01',fim:'03-31',label:'Jan – Mar'},
  {ini:'04-01',fim:'06-30',label:'Abr – Jun'},
  {ini:'07-01',fim:'09-30',label:'Jul – Set'},
  {ini:'10-01',fim:'12-31',label:'Out – Dez'}
];

function ensureTipos(){
  /* tipos are initialized at boot in init() — this is just a safety net */
  if(STATE.tiposAtividade.length===0)
    STATE.tiposAtividade = TIPOS_DEFAULT.map(n=>({id:uid(),nome:n}));
}

function getCiclo(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const m = d.getMonth(), y = d.getFullYear();
  const n = Math.floor(m/3);
  return {num:n+1, year:y, ...CICLO_RANGES[n],
    dataInicio: y+'-'+CICLO_RANGES[n].ini,
    dataFim:    y+'-'+CICLO_RANGES[n].fim};
}

function autoDateRange(periodo, dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
  if(periodo==='Dia') return {ini:dateStr, fim:dateStr};
  if(periodo==='Ciclo'){ const c=getCiclo(dateStr); return {ini:c.dataInicio, fim:c.dataFim}; }
  if(periodo==='Semana'){
    const dow = d.getDay(); const mon = new Date(d); mon.setDate(day-(dow===0?6:dow-1));
    const sun = new Date(mon); sun.setDate(mon.getDate()+6);
    return {ini:mon.toISOString().slice(0,10), fim:sun.toISOString().slice(0,10)};
  }
  if(periodo==='Mês'){
    const ini = new Date(y,m,1), fim = new Date(y,m+1,0);
    return {ini:ini.toISOString().slice(0,10), fim:fim.toISOString().slice(0,10)};
  }
  return {ini:dateStr, fim:dateStr};
}

function fmtRange(ini, fim){
  if(!ini) return '—';
  if(ini===fim) return fmtDate(ini);
  return fmtDate(ini)+' → '+fmtDate(fim);
}

let atividadePeriodo = 'Dia';
let atividadeData = todayStr();
let formPessoasTemp = [];

  const assignments = STATE.atividades.filter(a=>a.periodo===atividadePeriodo && a.dataInicio===autoDateRange(atividadePeriodo,atividadeData).ini);
  const assignMap = {};
  assignments.forEach(a=>{ assignMap[a.tipoId]=a; });

        const cr = CICLO_RANGES[n-1];

          style="padding:5px 16px;border-radius:20px;border:1.5px solid ${active?'#FA4616':'var(--line)'};

  let html = `

    <div class="btn-group">${periodBtns}</div>
    <div class="filters" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <input type="date" value="${atividadeData}" onchange="atividadeData=this.value;renderView()"
        style="border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;font-size:13.5px;background:var(--surface);color:var(--ink);">
      <button class="btn btn-secondary" onclick="openGerenciarTipos()">Editar atividades</button>
      <button class="btn btn-secondary" onclick="openTeamsConfig()" title="Configurar Teams" style="padding:8px 12px;">⚙ Teams</button>
      <button class="btn btn-primary" onclick="abrirCompartilhar()">Compartilhar</button>
    </div>
  </div>
  ${cicloHtml}
  <div class="panel" style="margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
      <div>
        <h3 style="margin:0;">${esc(atividadePeriodo)} ${ciclo?'— Ciclo '+ciclo.num+'/4':''}</h3>
        <span style="font-size:13px;color:var(--accent);font-weight:600;">${fmtRange(auto.ini, auto.fim)}</span>
      </div>
      <span style="font-size:12px;color:var(--ink-soft);">${assignments.length} de ${STATE.tiposAtividade.length} atribuídas</span>
    </div>
    <div class="table-wrap"><table><thead><tr>
      <th>Atividade</th><th>Responsáveis</th><th>Período</th><th>Horário</th><th>O que fazer</th><th></th>
    </tr></thead><tbody>
      ${STATE.tiposAtividade.map(t=>{
        const a = assignMap[t.id];
        const ids = a ? (a.pessoaIds||[a.pessoaId].filter(Boolean)) : [];
        const pessoas = ids.map(id=>findById(STATE.pessoas,id)).filter(Boolean);
        return `<tr>
          <td style="font-weight:600;">${esc(t.nome)}</td>

            : `<span style="color:var(--ink-soft);font-size:12px;">— não atribuído</span>`}
          </td>
          <td class="mono" style="font-size:11.5px;white-space:nowrap;">${a?fmtRange(a.dataInicio,a.dataFim):'—'}</td>
          <td class="mono" style="font-size:11.5px;white-space:nowrap;">${a&&a.inicio?a.inicio+(a.fim?' → '+a.fim:''):'—'}</td>
          <td style="font-size:12px;color:var(--ink-soft);max-width:160px;">${a?esc(a.obs)||'—':'—'}</td>

          </td>
        </tr>`;
      }).join('')}
    </tbody></table></div>
  </div>`;

  const colabMap = {};
  STATE.atividades.forEach(a=>{
    const ids = a.pessoaIds||[a.pessoaId].filter(Boolean);
    ids.forEach(pid=>{
      if(!pid) return;
      if(!colabMap[pid]) colabMap[pid]=[];
      const tipo = findById(STATE.tiposAtividade,a.tipoId);
      if(tipo) colabMap[pid].push({nome:tipo.nome, range:fmtRange(a.dataInicio,a.dataFim), inicio:a.inicio, fim:a.fim});
    });

async function submitAtribuicao(e, tipoId, periodo, iniRef, fimRef, existingId){
  e.preventDefault();
  if(formPessoasTemp.length===0){ showToast('Adicione pelo menos um responsável.',true); return false; }
  const data = {
    pessoaIds:[...formPessoasTemp], pessoaId:formPessoasTemp[0],
    dataInicio: document.getElementById('inp-ini').value || iniRef,
    dataFim:    document.getElementById('inp-fim-data').value || fimRef,
    inicio: document.getElementById('inp-inicio').value,
    fim:    document.getElementById('inp-fim').value,
    obs:    document.getElementById('inp-obs').value.trim()
  };
  if(existingId){ const a=findById(STATE.atividades,existingId); if(a) Object.assign(a,data); }
  else STATE.atividades.push({id:uid(), criadoEm:String(Date.now()), tipoId, periodo, ...data});
  await persist('atividades');
  closeModal(); renderView();
  showToast(existingId?'✓ Atualizado e salvo!':'✓ Atribuído e salvo no banco!');
  return false;
}

async function removerAtribuicao(id){

}

/* ---- COMPARTILHAR ---- */
function buildCompartilharData(){
  ensureTipos();
  const auto = autoDateRange(atividadePeriodo, atividadeData);
  const assignments = STATE.atividades.filter(a=>a.periodo===atividadePeriodo && a.dataInicio===auto.ini);
  const assignMap = {};
  assignments.forEach(a=>{ assignMap[a.tipoId]=a; });
  const ciclo = atividadePeriodo==='Ciclo' ? getCiclo(atividadeData) : null;
  const rows = STATE.tiposAtividade.map(t=>{
    const a = assignMap[t.id];
    const ids = a?(a.pessoaIds||[a.pessoaId].filter(Boolean)):[];
    const pessoas = ids.map(id=>findById(STATE.pessoas,id)).filter(Boolean);
    return {atividade:t.nome, pessoas, dataInicio:a?a.dataInicio:'', dataFim:a?a.dataFim:'', inicio:a?a.inicio:'', fim:a?a.fim:'', obs:a?a.obs:''};
  });
  const atribuidas = rows.filter(r=>r.pessoas.length>0);
  const naoAtribuidas = rows.filter(r=>r.pessoas.length===0);
  const byPerson = {};
  atribuidas.forEach(r=>{
    r.pessoas.forEach(p=>{
      if(!byPerson[p.id]) byPerson[p.id]={nome:p.nome,cargo:p.cargo,items:[]};
      byPerson[p.id].items.push(r);
    });
  });
  return {rows, atribuidas, naoAtribuidas, byPerson, ciclo, auto};
}

  const {rows, atribuidas, naoAtribuidas, byPerson, ciclo, auto} = buildCompartilharData();

async function gerarImagem(){

        ${ciclo?`<div style="display:flex;gap:6px;margin-top:10px;">${[1,2,3,4].map(n=>`<span style="padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;background:${n===ciclo.num?'#FA4616':'rgba(255,255,255,.12)'};color:#fff;">C${n}</span>`).join('')}</div>`:''}
      </div>
      <div style="background:#FA4616;border-radius:10px;padding:10px 18px;text-align:center;flex-shrink:0;">
        <div style="color:#0A0B23;font-size:13px;font-weight:700;">${esc(atividadePeriodo.toUpperCase())}</div>
        <div style="color:#0A0B23;font-size:11px;margin-top:2px;">${atribuidas.length} atividades · ${byPersonEntries.length} pessoas</div>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(${Math.min(byPersonEntries.length,3)},1fr);gap:12px;margin-bottom:20px;">
    ${byPersonEntries.map(data=>`
      <div style="background:#0B1934;border:1px solid #34353F;border-radius:10px;padding:14px;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
          <div style="width:36px;height:36px;border-radius:50%;background:#001A72;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0;">${data.nome.charAt(0)}</div>
          <div>
            <div style="font-weight:700;font-size:13px;color:#F2F1F7;">${esc(data.nome)}</div>
            <div style="font-size:11px;color:#AEB2C6;">${esc(data.cargo)}</div>
          </div>
        </div>
        ${data.items.map(item=>`
          <div style="padding:7px 10px;background:#1D1F2A;border-radius:6px;margin-bottom:5px;border-left:3px solid #FA4616;">
            <div style="font-weight:600;font-size:12px;color:#F2F1F7;">${esc(item.atividade)}</div>
            ${item.dataInicio?`<div style="font-size:10.5px;color:#AEB2C6;margin-top:2px;">📅 ${fmtRange(item.dataInicio,item.dataFim)}${item.inicio?' &nbsp;🕐 '+item.inicio+(item.fim?' → '+item.fim:''):''}</div>`:''}
            ${item.obs?`<div style="font-size:10.5px;color:#AEB2C6;margin-top:2px;font-style:italic;">${esc(item.obs)}</div>`:''}
          </div>`).join('')}
      </div>`).join('')}
  </div>

  ${rows.filter(r=>r.pessoas.length===0).length>0?`
  <div style="background:#1D1F2A;border:1px solid #E13F14;border-radius:8px;padding:10px 14px;">

  }
}

function baixarImagem(dataUrl, filename){
  const a = document.createElement('a');
  a.href = dataUrl; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  showToast('Imagem baixada!');
}

async function copiarImagemClipboard(dataUrl){
  try{
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
    showToast('Imagem copiada! Cole direto no Teams ou WhatsApp.');
  }catch(e){
    showToast('Clique com botão direito na imagem → Copiar imagem.', true);
  }
}

async function enviarTeams(){
  const url = STATE.config&&STATE.config.teamsWebhookUrl;
  if(!url){ openTeamsConfig(); return; }
  const {rows, ciclo, auto} = buildCompartilharData();
  const rangeLabel = fmtRange(auto.ini, auto.fim);
  const periodoLabel = atividadePeriodo+(ciclo?' — Ciclo '+ciclo.num+'/4':'');

  const facts = rows.map(r=>({
    name: r.atividade,
    value: r.pessoas.length ? r.pessoas.map(p=>p.nome).join(', ') : '— nao atribuido'
  }));

  const card = {
    "@type":"MessageCard",
    "@context":"https://schema.org/extensions",
    "themeColor":"FA4616",
    "summary":"Responsáveis — "+periodoLabel,
    "sections":[{
      "activityTitle":"📋 Responsáveis — "+periodoLabel,
      "activitySubtitle":"📅 "+rangeLabel,
      "activityImage":"",
      "facts": facts,
      "markdown":true
    }]
  };

  try{
    showToast('Enviando para o Teams...');
    const res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(card)
    });
    if(res.ok || res.status===200){ showToast('Enviado para o Teams com sucesso!'); }
    else { showToast('Erro ao enviar: '+res.status+'. Verifique a URL do webhook.',true); }
  }catch(e){ showToast('Erro de conexão: '+e.message,true); }
}

function copiarTexto(){
  const {rows, ciclo, auto} = buildCompartilharData();
  const rangeLabel = fmtRange(auto.ini, auto.fim);
  const periodoLabel = atividadePeriodo+(ciclo?' — Ciclo '+ciclo.num+'/4':'');
  let txt = '📋 RESPONSÁVEIS — '+periodoLabel.toUpperCase()+'\n📅 '+rangeLabel+'\n\n';
  rows.forEach(r=>{
    txt += '• '+r.atividade+': ';
    txt += r.pessoas.length ? r.pessoas.map(p=>p.nome).join(', ') : '— não atribuído';
    if(r.inicio) txt += ' ('+r.inicio+(r.fim?' → '+r.fim:'')+')';
    if(r.obs) txt += '\n  ↳ '+r.obs;
    txt += '\n';
  });
  txt += '\n_Central de Estoque_';
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>showToast('Texto copiado!'));
  else{ const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('Texto copiado!'); }
}

let qryImportRows = [];
function previewQryFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const text = ev.target.result;
    const lines = text.split(/\r?\n/).filter(l=>l.trim());
    const sep = lines[0].includes(';')?';':lines[0].includes('\t')?'\t':',';
    const headers = lines[0].split(sep).map(h=>h.trim().replace(/^"|"$/g,'').toLowerCase());
    qryImportRows = [];
    for(let i=1;i<lines.length;i++){
      const cells = lines[i].split(sep).map(c=>c.trim().replace(/^"|"$/g,''));
      if(!cells[0]) continue;
      const row = {};
      headers.forEach((h,idx)=>{ row[h]=cells[idx]||''; });
      qryImportRows.push({
        id: uid(),
        codigo: (row['id']||row['codigo']||row['code']||cells[0]).toUpperCase(),
        nome: row['legenda']||row['nome']||row['name']||cells[1]||'',
        categoria: row['categoria']||row['category']||'Geral',
        sistema: row['sistema']||row['system']||'',
        url: row['link']||row['url']||row['site']||'',
        finalidade: row['finalidade']||row['descricao']||row['description']||cells[4]||'',
        obs: row['obs']||row['observacao']||''
      });
    }
    const prev = document.getElementById('qry-preview');
    if(!prev) return;
    let html = '<div style="background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 14px;">';
    html += '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">Encontradas <strong style="color:var(--ink);">'+qryImportRows.length+'</strong> linhas</div>';
    qryImportRows.slice(0,3).forEach(r=>{
      html += '<div style="font-size:12px;padding:4px 0;border-bottom:1px dashed var(--line);">';
      html += '<span class="stamp-tag tag-neutral" style="font-size:10px;">'+esc(r.codigo)+'</span> ';
      html += esc(r.nome)+' — '+esc((r.finalidade||'').slice(0,60));
      html += '</div>';
    });
    if(qryImportRows.length>3) html += '<div style="font-size:11px;color:var(--ink-soft);margin-top:6px;">e mais '+(qryImportRows.length-3)+' linhas...</div>';
    html += '</div>';
    prev.innerHTML = html;
    document.getElementById('btn-import-qry').style.display='inline-flex';
  };
  reader.readAsText(file, 'UTF-8');
}

async function executeQryImport(){
  if(!qryImportRows.length){ showToast('Nenhuma linha para importar.',true); return; }
  const existCodigos = new Set(STATE.queries.map(q=>q.codigo));
  const novas = qryImportRows.filter(r=>!existCodigos.has(r.codigo));
  STATE.queries = [...STATE.queries, ...novas];
  await persist('queries');
  closeModal();
  renderView();
  showToast('✓ '+novas.length+' queries importadas!');
}

function getEmbedUrl(url, tipo){
  if(!url) return null;
  // Google Slides: convert /edit or /view to /embed
  if(url.includes('docs.google.com/presentation')){
    const base = url.split('/edit')[0].split('/view')[0].split('/pub')[0];
    return base + '/embed?start=false&loop=false&delayms=3000';
  }
  // Google Drive file: use viewer
  const driveMatch = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if(driveMatch){
    return 'https://drive.google.com/file/d/' + driveMatch[1] + '/preview';
  }
  // Google Docs: convert to preview
  if(url.includes('docs.google.com/document')){
    return url.replace('/edit','').replace('/view','') + '/preview';
  }
  // OneDrive / SharePoint embed URL (user pastes the embed src directly)
  if(url.includes('sharepoint.com') || url.includes('onedrive.live.com')){
    return url; // use as-is, user should paste embed URL
  }
  // PDF: wrap in Google Docs viewer
  if(url.endsWith('.pdf') || tipo==='PDF'){
    return 'https://docs.google.com/viewer?url=' + encodeURIComponent(url) + '&embedded=true';
  }
  return url;
}

<script src="audit/audit-db.js"></script>
<script src="audit/audit-rules.js"></script>
<script src="audit/audit-app.js"></script>
<script>
  audModuleInit();
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      // updateViaCache:'none' garante que o próprio sw.js nunca seja servido
      // do cache HTTP do navegador — sem isso, o navegador podia demorar
      // muito para perceber que o service worker mudou.
      // hadController: só recarrega quando é uma ATUALIZAÇÃO de um service
      // worker que já controlava a página — na primeira instalação nunca
      // houve controller, então updatefound dispara mas não deve recarregar.
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(reg=>{
        reg.update();
        reg.addEventListener('updatefound', ()=>{
          const novo = reg.installing;
          if(!novo) return;
          novo.addEventListener('statechange', ()=>{
            if(novo.state==='activated' && hadController) window.location.reload();
          });
        });
      }).catch(err=>console.warn('SW falhou ao registrar', err));
    });
  }
</script>
</body>
</html>
