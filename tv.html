<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV LDM</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icons/icon-192.png">
<!--
  Modo TV — página limpa, sem nenhum controle, pensada para ficar aberta
  o tempo todo no navegador do computador ligado na TV. Não lê nada do
  localStorage (o computador da TV não tem acesso ao localStorage de
  quem configurou) — toda a sequência, tempo, idioma e link de cada app
  vêm do link em si (depois de #cfg=), gerado na aba "TV LDM" do painel.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;}
  .tv-shell{position:fixed;inset:0;display:flex;flex-direction:column;background:#000;}
  .tv-band{flex-shrink:0;height:40px;background:#001A72;display:flex;align-items:center;justify-content:space-between;padding:0 22px;}
  .tv-band-brand{color:#fff;font-family:'Poppins',sans-serif;font-size:15px;font-weight:800;letter-spacing:.03em;}
  .tv-band-dest{color:rgba(255,255,255,.7);font-size:13px;font-weight:700;margin-left:10px;}
  .tv-band-clock{color:#fff;font-size:15px;font-weight:700;}
  .tv-frame{position:relative;flex:1;min-height:0;background:#fff;}
  .tv-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;}
  .tv-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;color:#8891C4;background:#0B0E26;font-size:16px;line-height:1.6;}
</style>
</head>
<body>
<div class="tv-shell">
  <div class="tv-band">
    <span><span class="tv-band-brand">OFICINA LDM</span><span class="tv-band-dest" id="dest" hidden></span></span>
    <span class="tv-band-clock" id="clock">--:-- · --/--/----</span>
  </div>
  <div class="tv-frame" id="frame">
    <p class="tv-empty" id="empty" hidden>Nenhuma configuração encontrada neste link.<br>Gere o link na aba "TV LDM" do painel e abra-o aqui.</p>
  </div>
</div>
<script>
(function(){
  var SETTLE_MS = 1200;
  var END_PAUSE_MS = 900;
  var KIOSK_CSS = '.sidebar,.sidebar-backdrop,.sidebar-toggle,[class*="filter" i]{display:none !important;}';

  function parseConfig(){
    var m = /#cfg=(.+)$/.exec(location.hash);
    if(!m) return null;
    try {
      var json = decodeURIComponent(escape(atob(m[1])));
      var data = JSON.parse(json);
      if(!data || !Array.isArray(data.items)) return null;
      return {
        dest: data.dest || '',
        items: data.items.filter(function(it){ return it && it.href; })
      };
    } catch(e){ return null; }
  }

  var config = parseConfig();
  var playlist = config ? config.items : null;
  var frameBox = document.getElementById('frame');
  var emptyMsg = document.getElementById('empty');
  var clockEl = document.getElementById('clock');
  var destEl = document.getElementById('dest');
  if(config && config.dest){
    destEl.textContent = '· ' + config.dest;
    destEl.hidden = false;
  }

  function updateClock(){
    var now = new Date();
    clockEl.textContent = now.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})
      + ' · ' + now.toLocaleDateString('pt-BR');
  }
  updateClock();
  setInterval(updateClock, 15000);

  if(!playlist || !playlist.length){
    emptyMsg.hidden = false;
    return;
  }

  var iframe = document.createElement('iframe');
  iframe.setAttribute('title', 'TV LDM');
  frameBox.appendChild(iframe);

  var SCROLL_SPEED_MULT = {slow:1.6, normal:1, fast:0.6};
  var index = 0;
  var durationMs = 0;
  var scrollMult = 1;
  var startTs = 0;
  var cachedMaxScroll = null;

  function injectKioskCss(){
    try {
      var doc = iframe.contentDocument;
      if(!doc || !doc.head) return;
      var style = doc.createElement('style');
      style.textContent = KIOSK_CSS;
      doc.head.appendChild(style);
    } catch(e){}
  }
  function findScrollTarget(win, doc){
    /* Os apps embutidos usam um shell flex com overflow:hidden no próprio
       <html>/<body> — quem realmente rola é um contêiner interno
       (.page-scroll, convenção compartilhada entre os apps). Rolar
       document.documentElement nesses casos não move nada, então
       primeiro tenta essa classe conhecida e, se não achar, procura o
       maior contêiner com overflow-y:auto/scroll na página. */
    var known = doc.querySelector('.page-scroll');
    if(known && known.scrollHeight - known.clientHeight > 4) return known;
    var best = null, bestDelta = 4;
    var all = doc.querySelectorAll('*');
    for(var i = 0; i < all.length; i++){
      var el = all[i];
      var delta = el.scrollHeight - el.clientHeight;
      if(delta <= bestDelta) continue;
      var oy = win.getComputedStyle(el).overflowY;
      if(oy === 'auto' || oy === 'scroll'){ best = el; bestDelta = delta; }
    }
    if(best) return best;
    var de = doc.documentElement;
    if(de.scrollHeight - win.innerHeight > 4) return de;
    return null;
  }
  var scrollTarget = null;
  function getMaxScroll(){
    if(cachedMaxScroll != null) return cachedMaxScroll;
    try {
      var win = iframe.contentWindow, doc = win.document;
      scrollTarget = findScrollTarget(win, doc);
      if(scrollTarget){
        var m = scrollTarget === doc.documentElement
          ? scrollTarget.scrollHeight - win.innerHeight
          : scrollTarget.scrollHeight - scrollTarget.clientHeight;
        if(m > 0){ cachedMaxScroll = m; return m; }
      }
    } catch(e){}
    return 0;
  }
  function applyScrollFraction(frac){
    var max = getMaxScroll();
    if(max <= 0 || !scrollTarget) return;
    try { scrollTarget.scrollTop = max * frac; } catch(e){}
  }

  function playIndex(i){
    index = ((i % playlist.length) + playlist.length) % playlist.length;
    var item = playlist[index];
    durationMs = Math.max(5, item.duration || 20) * 1000;
    scrollMult = SCROLL_SPEED_MULT[item.scrollSpeed] || 1;
    startTs = Date.now();
    cachedMaxScroll = null;
    scrollTarget = null;
    iframe.src = item.href;
    iframe.onload = function(){ injectKioskCss(); };
    tick();
  }
  function tick(){
    var el = Date.now() - startTs;
    var scrollMs = Math.max(600, (durationMs - SETTLE_MS - END_PAUSE_MS) * scrollMult);
    var scrollFrac = Math.min(1, Math.max(0, (el - SETTLE_MS) / scrollMs));
    applyScrollFraction(scrollFrac);
    if(el >= durationMs){ playIndex(index + 1); return; }
    requestAnimationFrame(tick);
  }

  playIndex(0);

  try {
    document.addEventListener('click', function once(){
      document.removeEventListener('click', once);
      if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
    });
  } catch(e){}
})();
</script>
</body>
</html>
