<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NET — Oficina LDM</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#0B1230">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Mesmo padrão "Painel Oficina LDM" do hub raiz — mesmas variáveis,
     mesma sidebar (252px, logo 60px interativa, nav em pílula) e mesmo
     topbar (h1 26px Poppins, sem borda). Só o essencial do hub + o que
     é específico deste módulo (por enquanto só a casca do NET). */
  :root{
    --bg0:#F2F4FA;--surface:#FFFFFF;--line:#DCE1F0;
    --ink:#101633;--ink-soft:#5B6485;--card-top:#FFFFFF;--card-bottom:#FFFFFF;
    --chip-bg:#EDF0F9;--chip-bg-hover:#E1E6F4;
    --shadow-col:rgba(16,22,60,.14);--shadow-near:rgba(16,22,60,.06);
    --orange:#FE5000;--rivet:rgba(16,22,60,.16);
  }
  body.theme-dark{
    --bg0:#070910;--surface:rgba(255,255,255,.045);--line:rgba(255,255,255,.1);
    --ink:#F3F2FA;--ink-soft:#8E95C2;--card-top:rgba(255,255,255,.055);--card-bottom:rgba(255,255,255,.02);
    --chip-bg:rgba(255,255,255,.06);--chip-bg-hover:rgba(255,255,255,.14);
    --shadow-col:rgba(0,0,0,.55);--shadow-near:rgba(0,0,0,.3);--rivet:rgba(255,255,255,.22);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg0);color:var(--ink);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;}
  a{color:var(--orange);}
  :focus-visible{outline:2px solid var(--orange);outline-offset:2px;}

  .zoom-ctrl{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:100px;padding:3px;}
  .zoom-ctrl button{width:24px;height:24px;border-radius:50%;border:none;background:var(--chip-bg);color:var(--ink);font-size:15px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .zoom-ctrl button:hover{background:var(--orange-light,rgba(254,80,0,.12));color:var(--orange);}
  .zoom-ctrl span{font-size:11px;color:var(--ink-soft);min-width:34px;text-align:center;font-family:'SFMono-Regular',Consolas,monospace;}
  .zoom-ctrl-float{position:fixed;right:16px;bottom:16px;z-index:70;box-shadow:0 6px 18px rgba(0,0,0,.18);}

  .shell{display:flex;min-height:100vh;width:100%;}

  /* SIDEBAR — azul-marinho fixo, não acompanha o tema (âncora visual da marca) */
  .sidebar{width:252px;flex-shrink:0;background:#0B1230;border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;padding:28px 24px;color:#C7CCEA;}
  .brand{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
  .brand-logo{position:relative;width:60px;height:60px;border-radius:18px;background:linear-gradient(145deg,#FF8A4C,var(--orange) 55%,#C83812);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;overflow:hidden;border:none;box-shadow:0 10px 22px -6px rgba(254,80,0,.6),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .25s;padding:0;}
  .brand-logo:hover{transform:translateY(-2px) scale(1.045);}
  .brand-logo::before{content:'';position:absolute;top:-50%;left:-70%;width:55%;height:220%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:rotate(18deg);animation:shine 5s ease-in-out infinite;}
  @keyframes shine{0%{left:-70%;}38%{left:150%;}100%{left:150%;}}
  .brand-logo img{position:relative;z-index:1;width:70%;height:70%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));pointer-events:none;}
  .brand-logo:hover img{animation:wiggle 1s ease-in-out infinite;}
  @keyframes wiggle{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-9deg);}75%{transform:rotate(9deg);}}
  .brand-logo.spin img{animation:spin360 .6s cubic-bezier(.34,1.56,.64,1);}
  @keyframes spin360{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .brand-name{font-family:'Poppins',sans-serif;font-size:17px;font-weight:800;color:#fff;line-height:1.15;}
  .brand-sub{font-size:11px;color:#8891C4;margin-top:2px;}

  /* Único item que o Painel raiz não tem (ele já é a Central) — estilizado
     pra se encaixar no mesmo ritmo visual da navegação em pílula. */
  .brand-back{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:0 0 16px;border-radius:11px;color:#9BA2CC;text-decoration:none;font-size:12.5px;font-weight:600;transition:background .2s,color .2s;}
  .brand-back:hover{background:rgba(255,255,255,.06);color:#fff;}

  .sb-nav{display:flex;flex-direction:column;gap:3px;margin:4px 0 20px;}
  .sb-nav-item{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;border-radius:11px;padding:10px 12px;color:#9BA2CC;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:left;transition:background .2s,color .2s;}
  .sb-nav-item svg{flex-shrink:0;opacity:.85;transition:opacity .2s,color .2s;}
  .sb-nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .sb-nav-item.active{background:rgba(254,80,0,.16);color:#fff;}
  .sb-nav-item.active svg{color:var(--orange);opacity:1;}

  .sb-foot{margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#6B74A8;}

  /* MAIN */
  .main{position:relative;flex:1;min-width:0;padding:40px 48px 70px;}
  .topbar{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;}
  .topbar h1{font-family:'Poppins',sans-serif;font-size:26px;font-weight:800;margin:0;}
  .topbar p{margin:5px 0 0;color:var(--ink-soft);font-size:13.5px;max-width:480px;}
  .topbar-actions{display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .cd-badge{background:var(--chip-bg);border:1px solid var(--line);color:var(--ink-soft);font-size:11px;font-weight:700;letter-spacing:.04em;padding:7px 14px;border-radius:100px;}
  .theme-switch{position:relative;width:54px;height:28px;border-radius:999px;background:var(--chip-bg);border:1px solid var(--line);cursor:pointer;flex-shrink:0;padding:0;}
  .theme-knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;color:#fff;transition:left .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 3px 8px -2px rgba(254,80,0,.6);}
  .theme-switch.on .theme-knob{left:29px;}

  .view[hidden]{display:none;}

  /* Casca inicial do NET — conteúdo entra nos próximos passos */
  /* ===== Telas do app ===== */
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#fff;border:none;border-radius:12px;padding:10px 16px;font:700 13px 'Inter',sans-serif;cursor:pointer;box-shadow:0 8px 18px -8px rgba(254,80,0,.7);transition:transform .15s,filter .15s;}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.05);}
  .btn.sec{background:var(--chip-bg);color:var(--ink);border:1px solid var(--line);box-shadow:none;}
  .btn.sec:hover{background:var(--chip-bg-hover);}
  .btn.cta{margin-top:30px;padding:13px 22px;font-size:14px;}
  .muted{color:var(--ink-soft);}
  .neg{color:#D83C1E;} .pos{color:#1F8A52;}
  body.theme-dark .neg{color:#FF7A5C;} body.theme-dark .pos{color:#4ADE80;}

  .mes-barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 0;}
  .mes-rot{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
  .mes-chips{display:flex;gap:8px;flex-wrap:wrap;}
  .mes-chip{background:var(--chip-bg);border:1px solid var(--line);color:var(--ink);border-radius:100px;padding:7px 14px;font:600 12.5px 'Inter',sans-serif;cursor:pointer;}
  .mes-chip.on{background:var(--orange);border-color:var(--orange);color:#fff;}

  .dropzone{display:flex;align-items:center;gap:16px;margin:16px 0 0;padding:20px 22px;border:2px dashed var(--line);border-radius:20px;background:var(--surface);cursor:pointer;color:var(--ink-soft);transition:border-color .2s,background .2s;}
  .dropzone svg{color:var(--orange);flex-shrink:0;}
  .dropzone strong{display:block;color:var(--ink);font-size:14.5px;margin-bottom:3px;}
  .dropzone span{font-size:12.5px;line-height:1.5;}
  .dropzone:hover,.dropzone.over{border-color:var(--orange);background:color-mix(in srgb, var(--orange) 6%, var(--surface));}

  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:22px 0 0;}
  .kpi{background:linear-gradient(180deg,var(--card-top),var(--card-bottom));border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 2px var(--shadow-near),0 14px 30px -18px var(--shadow-col);border-top:4px solid var(--line);}
  .kpi-rot{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
  .kpi strong{font-family:'Poppins',sans-serif;font-size:22px;font-weight:800;}
  .kpi-sub{font-size:12px;color:var(--ink-soft);}
  .kpi.k-perda{border-top-color:#D83C1E;} .kpi.k-ganho{border-top-color:#1F8A52;}
  .kpi.k-net{border-top-color:var(--orange);background:linear-gradient(135deg,#001A72,#0B1230);color:#fff;border-color:transparent;}
  .kpi.k-net .kpi-rot,.kpi.k-net .kpi-sub{color:#C7CCEA;}
  .kpi.k-net.neg strong{color:#FF8A6B;} .kpi.k-net.pos strong{color:#6EE7A0;}
  .kpi.k-fora{border-top-color:#9AA1BD;}

  .alerta{margin:16px 0 0;padding:13px 16px;border-radius:14px;background:rgba(254,80,0,.1);border:1px solid rgba(254,80,0,.35);font-size:13px;line-height:1.5;}

  .painel{background:var(--surface);border:1px solid var(--line);border-radius:20px;margin:18px 0 0;box-shadow:0 1px 2px var(--shadow-near),0 14px 30px -20px var(--shadow-col);overflow:hidden;}
  .painel-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding:18px 20px 12px;}
  .painel-cab h3{margin:0 0 4px;font-size:15.5px;font-weight:800;}
  .painel-cab p{margin:0;font-size:12.5px;color:var(--ink-soft);max-width:620px;line-height:1.5;}
  .acoes{display:flex;gap:10px;flex-wrap:wrap;}
  .tabela-wrap{overflow:auto;max-height:640px;}
  .tab{width:100%;border-collapse:collapse;font-size:12.5px;}
  .tab th{position:sticky;top:0;z-index:1;background:var(--chip-bg);text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
  body.theme-dark .tab th{background:#141A33;}
  .tab td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .tab .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .tab td.nome{min-width:240px;}
  .tab tfoot td{font-weight:800;background:var(--chip-bg);border-bottom:none;}
  .tab tr.fora td{opacity:.55;}
  .pref{display:inline-block;font:800 11px 'Inter',sans-serif;background:#001A72;color:#fff;border-radius:6px;padding:3px 7px;letter-spacing:.03em;}
  .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:100px;padding:3px 9px;}
  .tag.sim{background:rgba(31,138,82,.14);color:#1F8A52;} .tag.nao{background:rgba(154,161,189,.2);color:var(--ink-soft);cursor:help;}
  .rodape-info{font-size:12px;color:var(--ink-soft);margin:14px 2px 0;line-height:1.5;}
  .vazio{margin:22px 0 0;padding:34px;border:1px dashed var(--line);border-radius:20px;text-align:center;color:var(--ink-soft);}
  .vazio h3{color:var(--ink);margin:0 0 6px;font-size:16px;}
  .vazio p{margin:0 auto;max-width:520px;font-size:13px;line-height:1.55;}

  .filtros{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 0;}
  .filtros input,.filtros select,.dep-linha input,.tab.leg input{font:500 13px 'Inter',sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;}
  .filtros input{flex:1;min-width:220px;}
  .resumo-linha{display:flex;gap:22px;flex-wrap:wrap;margin:14px 2px 0;font-size:13px;color:var(--ink-soft);}
  .resumo-linha strong{color:var(--ink);}
  .mais{padding:14px;text-align:center;}

  .tab.leg input{width:100%;min-width:90px;padding:7px 9px;font-size:12.5px;background:transparent;}
  .tab.leg input.in-id{min-width:80px;max-width:100px;font-weight:800;text-transform:uppercase;}
  .tab.leg input.in-setor{max-width:100px;}
  .tab.leg td{padding:6px 8px;}
  .switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;font-weight:700;}
  .switch input{width:16px;height:16px;accent-color:var(--orange);}
  .x{background:none;border:none;color:var(--ink-soft);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px;}
  .x:hover{background:rgba(216,60,30,.12);color:#D83C1E;}
  .dep-linha{display:flex;gap:10px;padding:0 20px 18px;flex-wrap:wrap;}
  .dep-linha input{width:220px;}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#0B1230;color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:calc(100% - 32px);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.erro{background:#B42318;}



  /* ===== Painel de fechamento ===== */
  .btn.mini{padding:7px 12px;font-size:12px;border-radius:10px;white-space:nowrap;}
  .fech-card{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px 26px;box-shadow:0 1px 2px var(--shadow-near),0 14px 30px -20px var(--shadow-col);border-top:4px solid var(--orange);}
  .fech-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
  .fech-eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--orange);}
  .fech-cab h2{font-family:'Poppins',sans-serif;font-size:26px;font-weight:800;margin:4px 0 0;}
  .fech-msg{color:var(--ink-soft);font-size:14px;line-height:1.6;max-width:640px;margin:14px 0 18px;}
  .fech-card .kpis{margin-top:18px;}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 12px;border-radius:100px;white-space:nowrap;}
  .status::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;}
  .status.pend{background:rgba(180,83,9,.12);color:#B45309;}
  .status.pronto{background:rgba(0,26,114,.1);color:#2E4596;}
  .status.ok{background:rgba(31,138,82,.13);color:#1F8A52;}
  body.theme-dark .status.pronto{background:rgba(142,162,255,.15);color:#A9B8FF;}
  body.theme-dark .status.pend{color:#F59E0B;}
  body.theme-dark .status.ok{color:#4ADE80;}
  .passos-tit{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:24px 0 10px;}
  .passos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .passo{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--chip-bg);}
  .passo-n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;background:var(--surface);border:2px solid var(--line);color:var(--ink-soft);}
  .passo.ok .passo-n{background:#1F8A52;border-color:#1F8A52;color:#fff;}
  .passo.pend .passo-n{background:#B45309;border-color:#B45309;color:#fff;}
  .passo-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .passo-txt strong{font-size:13.5px;}
  .passo-txt span{font-size:12.5px;color:var(--ink-soft);line-height:1.45;}
  .graf-wrap{overflow-x:auto;padding:4px 20px 18px;color:var(--ink);}
  .tab tr.clicavel{cursor:pointer;}
  .tab tr.clicavel:hover td{background:var(--chip-bg);}
  .fech-atalho{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:16px 0 0;padding:12px 16px;border:1px dashed var(--line);border-radius:14px;font-size:13px;color:var(--ink-soft);}

  /* ===== Importar QRY410 ===== */
  .dropzone.grande{margin-top:24px;padding:30px 28px;}
  .dropzone.grande strong{font-size:16px;}
  .imp-topo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:stretch;margin-top:24px;}
  .imp-topo .dropzone.grande{margin-top:0;flex-direction:column;justify-content:center;text-align:center;}
  .imp-topo .painel{margin-top:0;}
  .guia-lista{margin:0;padding:0 20px 20px 40px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.55;color:var(--ink-soft);}
  .guia-lista strong{color:var(--ink);}
  .tab td.arqs{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  @media(max-width:1100px){ .imp-topo{grid-template-columns:1fr;} }
  @media(max-width:760px){ .passo{flex-wrap:wrap;} .passo-txt{flex:1 1 calc(100% - 44px);} .passo .btn{margin-left:42px;} .fech-card{padding:20px 18px;} }
  /* ===== Relatório da controladoria ===== */
  .rel-prev{position:relative;overflow:hidden;padding:0;margin:0 20px 20px;border:1px solid var(--line);border-radius:12px;}
  .rel-prev-in{width:1200px;transform-origin:0 0;}
  .rel-campos{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;padding:0 20px 20px;}
  .rel-campo:first-child{grid-column:1/-1;}
  .rel-campo label{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .rel-campo textarea{width:100%;resize:vertical;font:500 13px/1.45 'Inter',sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;}
  .link{background:none;border:none;color:var(--orange);font:700 11.5px 'Inter',sans-serif;cursor:pointer;padding:0;text-decoration:underline;}
  @media(max-width:900px){ .rel-campos{grid-template-columns:1fr;} }

  /* Boletim — layout fixo de 1200px, sempre claro (é a imagem que vai pra controladoria) */
  .bl{width:1200px;background:#fff;color:#14172B;font-family:'Inter',Arial,sans-serif;}
  .bl-head{display:flex;justify-content:space-between;align-items:center;padding:34px 40px;background:linear-gradient(120deg,#001A72 0%,#0B1230 75%,#14172B 100%);}
  .bl-eye{color:#FE5000;font-size:13px;font-weight:800;letter-spacing:.32em;}
  .bl-h1{color:#fff;font-size:36px;font-weight:800;margin:10px 0 8px;}
  .bl-sub{color:#C7CCEA;font-size:16px;}
  .bl-logo{height:68px;}
  .bl-body{padding:26px 40px 10px;}
  .bl-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .bl-kpi{background:#F5F6FA;border:1px solid #E3E6EF;border-radius:10px;padding:22px 24px;}
  .bl-kpi span{display:block;font-size:12px;font-weight:700;letter-spacing:.3em;color:#6B7190;margin-bottom:12px;}
  .bl-kpi strong{font-size:27px;font-weight:800;}
  .bl-kpi.net{background:#fff;border:2px solid #FE5000;}
  .bl-kpi.net span{color:#FE5000;}
  .bl-row{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:22px;align-items:start;}
  .bl-card{border:1px solid #E3E6EF;border-radius:10px;padding:20px;min-height:420px;display:flex;flex-direction:column;}
  .bl-card h4,.bl-t{margin:0 0 12px;font-size:15px;font-weight:800;color:#001A72;letter-spacing:.02em;}
  .bl-donut{display:flex;align-items:center;gap:8px;flex:1;}
  .bl-dlista{display:flex;flex-direction:column;gap:9px;}
  .bl-dl{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.3;}
  .bl-dl span{display:block;color:#6B7190;}
  .bl-dot{width:11px;height:11px;border-radius:3px;margin-top:3px;flex-shrink:0;}

<div class="zoom-ctrl zoom-ctrl-float" title="Zoom da tela">
  <button type="button" id="zoomOut" aria-label="Diminuir zoom">&minus;</button>
  <span id="zoomLabel">100%</span>
  <button type="button" id="zoomIn" aria-label="Aumentar zoom">+</button>
</div>

<script>
(function(){
  /* Mesma chave usada no Painel Oficina LDM (raiz) — os dois compartilham
     origem, então o tema escolhido em um lugar vale no outro também. */
  var SUN = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
  var MOON = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  var btn = document.getElementById('themeSwitch');
  var knob = document.getElementById('themeKnob');
  function apply(dark){
    document.body.classList.toggle('theme-dark', dark);
    btn.classList.toggle('on', dark);
    knob.innerHTML = dark ? MOON : SUN;
  }
  var dark = false;
  try { dark = localStorage.getItem('ldm-theme') === 'dark'; } catch(e){}
  apply(dark);
  btn.addEventListener('click', function(){
    dark = !dark;
    apply(dark);
    try { localStorage.setItem('ldm-theme', dark ? 'dark' : 'light'); } catch(e){}
  });
})();

(function(){
  var MIN = 70, MAX = 150, STEP = 10;
  var label = document.getElementById('zoomLabel');
  function aplicar(pct){
    pct = Math.max(MIN, Math.min(MAX, pct));
    document.body.style.zoom = (pct / 100);
    if(label) label.textContent = pct + '%';
    try { localStorage.setItem('ldm-zoom', pct); } catch(e){}
    return pct;
  }
  var atual = 100;
  try { atual = parseInt(localStorage.getItem('ldm-zoom'), 10) || 100; } catch(e){}
  atual = aplicar(atual);
  var btnOut = document.getElementById('zoomOut');
  var btnIn = document.getElementById('zoomIn');
  if(btnOut) btnOut.addEventListener('click', function(){ atual = aplicar(atual - STEP); });
  if(btnIn) btnIn.addEventListener('click', function(){ atual = aplicar(atual + STEP); });
})();

document.getElementById('brandLogo').addEventListener('click', function(){
  var el = this;
  el.classList.remove('spin');
  void el.offsetWidth;
  el.classList.add('spin');
});

(function(){
  var TAB_LABELS = {
    painel: ['Fechamento NET', 'Valor líquido de perdas e ganhos do CD para a controladoria.'],
    importar: ['Importar QRY410', 'Base de perdas e ganhos do CD — Lógicas 301 e 302.'],
    fechamento: ['Fechamento do mês', 'Importa a QRY410, aplica a legenda e gera a planilha da controladoria.'],
    relatorio: ['Relatório da controladoria', 'Boletim de 1 página e apresentação do fechamento, gerados a partir do mês importado.'],
    l301: ['Lógica 301 · Perda por Inventário', 'Todas as saídas da QRY410 no mês, com prefixo e se entram no NET.'],
    l302: ['Lógica 302 · Localização Inventário (Ganho)', 'Todas as entradas da QRY410 no mês, com prefixo e se entram no NET.'],
    legenda: ['Legenda', 'O que cada prefixo da Observação WMS significa e se entra no NET.']
  };
  var titleEl = document.getElementById('tab-title');
  var subtitleEl = document.getElementById('tab-subtitle');
  var navEl = document.getElementById('nav');

  function switchTab(tab){
    if(!TAB_LABELS[tab]) return;
    document.querySelectorAll('.view').forEach(function(v){
      v.hidden = v.dataset.view !== tab;
    });
    document.querySelectorAll('.sb-nav-item[data-tab]').forEach(function(b){
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    titleEl.textContent = TAB_LABELS[tab][0];
    subtitleEl.textContent = TAB_LABELS[tab][1];
    try { history.replaceState(null, '', '#' + tab); } catch(e){}
  }
  window.netSwitchTab = switchTab;

  navEl.addEventListener('click', function(e){
    var btn = e.target.closest('.sb-nav-item[data-tab]');
    if(btn) switchTab(btn.dataset.tab);
  });
  document.addEventListener('click', function(e){
    var b = e.target.closest('button[data-goto]');
    if(b) switchTab(b.dataset.goto);
  });

  var initialTab = 'painel';
  try {
    var hashTab = decodeURIComponent(location.hash.slice(1));
    if(hashTab && TAB_LABELS[hashTab]) initialTab = hashTab;
  } catch(e){}
  switchTab(initialTab);
})();
</script>
